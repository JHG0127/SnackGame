<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미니 게임 모음</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <main class="app" aria-labelledby="game-title">
    <section class="game-panel">
      <header class="header">
        <div>
          <p id="game-eyebrow" class="eyebrow">Sliding Puzzle</p>
          <h1 id="game-title">4x4 숫자 퍼즐</h1>
        </div>
        <div class="actions">
          <button id="info-button" class="icon-button" type="button" aria-label="게임 설명 보기" aria-haspopup="dialog">
            i
          </button>
          <button id="new-game-button" class="button primary" type="button" aria-label="새 게임 시작">
            새 게임
          </button>
          <button id="reset-record-button" class="button" type="button" aria-label="현재 게임 최고 기록 초기화">
            기록 초기화
          </button>
        </div>
      </header>

      <nav class="game-switcher" aria-label="게임 선택">
        <button class="game-tab active" type="button" data-game="puzzle" aria-pressed="true">
          숫자 퍼즐
        </button>
        <button class="game-tab" type="button" data-game="memory" aria-pressed="false">
          카드 기억
        </button>
      </nav>

      <section class="stats" aria-label="현재 게임 상태">
        <div class="stat">
          <span id="move-label" class="stat-label">이동</span>
          <strong id="move-count">0</strong>
        </div>
        <div class="stat">
          <span class="stat-label">시간</span>
          <strong><span id="elapsed-time">0</span>초</strong>
        </div>
      </section>

      <section class="records" aria-label="최고 기록">
        <div>
          <span id="best-move-label" class="record-label">최소 이동</span>
          <strong id="best-moves">-</strong>
        </div>
        <div>
          <span class="record-label">최단 시간</span>
          <strong><span id="best-time">-</span><span id="best-time-unit"></span></strong>
        </div>
      </section>

      <div
        id="board"
        class="board"
        role="grid"
        aria-label="4 곱하기 4 슬라이딩 퍼즐 보드. 빈칸과 맞닿은 타일을 클릭하거나 방향키로 이동하세요."
        tabindex="0"
      ></div>

      <p id="message" class="message" aria-live="polite"></p>
    </section>
  </main>

  <div id="info-dialog" class="dialog-backdrop" role="dialog" aria-modal="true" aria-labelledby="info-title" hidden>
    <section class="dialog">
      <header class="dialog-header">
        <h2 id="info-title">게임 방법</h2>
        <button id="close-info-button" class="icon-button" type="button" aria-label="게임 설명 닫기">
          ×
        </button>
      </header>
      <div id="info-content" class="dialog-content"></div>
    </section>
  </div>

  <script src="script.js?v=3"></script>
</body>
</html>
